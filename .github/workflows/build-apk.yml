name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies
        run: npm install

      - name: Bundle tz-lookup locally (offline timezone)
        run: cp node_modules/tz-lookup/tz.js www/tz.js

      - name: Add Android platform
        run: npx cap add android

      - name: Apply app icon
        run: |
          unzip -q icons.zip -d icons_tmp
          cp -r icons_tmp/res/* android/app/src/main/res/
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#2A1A5E</color>
          </resources>
          XML

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vedic-Kundli-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
